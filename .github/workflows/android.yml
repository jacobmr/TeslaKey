name: Android CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Verify Gradle wrapper permissions
        run: test -x ./gradlew

      - name: Test, lint, and build
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease
